services:
  pdf-signer:
    build:
      context: .
      target: production
    image: multi-sign-pdf:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:${HOST_PORT:-3001}}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s